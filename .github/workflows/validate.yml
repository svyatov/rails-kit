name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate skill contracts
        run: ruby scripts/validate.rb
      - name: Test validator regressions
        run: ruby scripts/validate_test.rb
      - name: Test Rails upgrade detection
        shell: ruby {0}
        run: |
          skill = "skills/upgrade-rails"
          system("ruby", "#{skill}/tests/detection_test.rb", exception: true)
          system("ruby", "#{skill}/references/ombulabs/detection-scripts/scan_patterns.rb", "--self-test", exception: true)
          system("ruby", "#{skill}/references/ombulabs/detection-scripts/gem_limits.rb", "--self-test", exception: true)
      - name: Download Claude Code installer
        run: curl -fsSL https://claude.ai/install.sh --output "$RUNNER_TEMP/install-claude.sh"
      - name: Install Claude Code
        run: bash "$RUNNER_TEMP/install-claude.sh"
      - name: Validate marketplace and root plugin
        shell: ruby {0}
        run: |
          claude = File.join(Dir.home, ".local/bin/claude")
          system(claude, "plugin", "validate", "--strict", "--json", ".", exception: true)
