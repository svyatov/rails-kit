---
version: '4.0'
description: Selected Rails 4.0 upgrade candidates verified against official sources; not a complete compatibility check.
upgrade_findings:
  high_priority:
  - name: attr_accessible usage
    pattern: attr_accessible
    exclude: ''
    search_paths:
    - app/models/
    - lib/
    variable_name: ATTR_ACCESSIBLE
    kind: breaking
    explanation: Rails 4.0 extracts model mass-assignment protection from core.
    fix: Move the permitted attributes to controller Strong Parameters, preserving the authorization policy. An existing compatibility gem may alter applicability.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2608
    verified_at: '2026-10-23'
  - name: attr_protected usage
    pattern: attr_protected
    exclude: ''
    search_paths:
    - app/models/
    - lib/
    variable_name: ATTR_PROTECTED
    kind: breaking
    explanation: Rails 4.0 extracts model mass-assignment protection from core.
    fix: Replace the deny-list with an explicit permitted attribute list at the controller boundary. Review role-specific access before removing the model declaration.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2608
    verified_at: '2026-10-23'
  - name: vendor/plugins directory
    pattern: ''
    exclude: ''
    search_paths:
    - vendor/plugins/
    variable_name: VENDOR_PLUGINS
    kind: breaking
    explanation: Rails 4.0 does not load plugins from vendor/plugins.
    fix: Package the required plugin as a gem, or move its code into lib with explicit initialization. Preserve load order.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2593
    verified_at: '2026-10-23'
  - name: ActiveRecord Observers
    pattern: ActiveRecord::Observer|observer.*:.*\w+_observer|config\.active_record\.observers
    exclude: ''
    search_paths:
    - app/
    - config/
    variable_name: OBSERVERS
    kind: breaking
    explanation: Rails 4.0 extracts Active Record observers from core.
    fix: Check whether rails-observers already supplies this API. Retain that dependency if needed, or replace the observer with equivalent tested application behavior.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2811
    verified_at: '2026-10-23'
  - name: ActionController Sweepers
    pattern: cache_sweeper|ActionController::Caching::Sweeper|< ActionController::Caching::Sweeper
    exclude: ''
    search_paths:
    - app/
    variable_name: SWEEPERS
    kind: breaking
    explanation: Rails 4.0 extracts Action Controller sweepers from core.
    fix: Check the existing rails-observers dependency before changing the sweeper. Preserve cache-expiration behavior.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2811
    verified_at: '2026-10-23'
  - name: Action caching (caches_action)
    pattern: "\\b(?:caches_action|expire_action)\\b"
    exclude: "^\\s*#"
    search_paths:
    - app/
    - lib/
    variable_name: ACTION_CACHING
    kind: breaking
    explanation: Rails 4.0 extracts action caching from Action Pack.
    fix: Check whether actionpack-action_caching already supplies the method. Preserve the cache and authorization behavior if replacing it.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2697
    verified_at: '2026-10-23'
  - name: Page caching (caches_page)
    pattern: "\\b(?:caches_page|expire_page|cache_page|page_cache_directory)\\b"
    exclude: "^\\s*#"
    search_paths:
    - app/
    - lib/
    - config/
    variable_name: PAGE_CACHING
    kind: breaking
    explanation: Rails 4.0 extracts page caching from Action Pack.
    fix: Check whether actionpack-page_caching already supplies the method. Preserve expiration and public-access behavior if replacing it.
    sources:
    - https://github.com/rails/rails/blob/v8.1.0/guides/source/upgrading_ruby_on_rails.md#L2697
    verified_at: '2026-10-23'
  medium_priority: []
  low_priority: []
